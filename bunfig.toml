[test]

coverage = true

coverageSkipTestFiles = true

coveragePathIgnorePatterns = [
  "lib/defaults/**",
  "test/utils/*.ts",
  "test/fixtures/**/**.ts",
  "dist/**/*.js",
  "dist/**/*.ts",
  "../**/*.ts",
  "../**/*.js",
]

[test.reporter]
junit = "junit.xml"

[fmt]
printWidth = 120
singleQuote = true
tabWidth = 2
useTabs = false
endOfLine = "lf"
semi = true
trailingComma = "all"
quoteProps = "as-needed"
bracketSpacing = true
arrowParens = "always"
jsxSingleQuote = false
proseWrap = "preserve"
htmlWhitespaceSensitivity = "css"
embeddedLanguageFormatting = "auto"
ignorePatterns = [
  ".changeset/",
  ".claude/",
  ".cursor/",
  ".github/",
  "*.log",
  "*.md",
  "bun.lockb",
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
]
